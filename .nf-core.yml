lint:
  files_unchanged:
    - .gitignore
    # Pre-existing drift from the nf-core 4.0.2 template (unrelated to this
    # module update); refreshed by the 4.0.3 template update. Exempt so the
    # modules-only PR lints clean.
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/nf-core-atacseq_logo_light.png
    - docs/images/nf-core-atacseq_logo_light.png
  merge_markers:
    # False positive: SAM base-quality strings contain runs of '<' that trip the
    # merge-marker check. Snapshot shipped by nf-core/modules bowtie2/align.
    - modules/nf-core/bowtie2/align/tests/main.nf.test.snap
  nextflow_config:
    - config_defaults:
        - params.bamtools_filter_se_config
        - params.bamtools_filter_pe_config
nf_core_version: 4.0.2
repository_type: pipeline
template:
  author: Patel H, Langer B, Espinosa-Carrasco J, Syme R
  description: ATACSeq peak-calling and differential analysis pipeline.
  force: false
  is_nfcore: true
  name: atacseq
  org: nf-core
  outdir: .
  version: 2.2.0dev
